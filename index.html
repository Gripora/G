<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIPORA</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000}body{overflow-x:hidden}.page{position:relative;width:100%;margin:0;background:#000;min-height:100vh}.page>img{display:block;width:100vw;height:auto;max-width:none;image-rendering:auto;filter:url(#sharpen)}.hot{position:absolute;display:block;z-index:3;background:transparent;cursor:pointer}.anchor{position:absolute;width:1px;height:1px;pointer-events:none}.loading{color:#fff;font:14px Arial,sans-serif;text-align:center;padding:40px}@media(max-width:700px){.page>img{width:100%;filter:none}}</style></head><body><svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="sharpen" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 -0.18 0 -0.18 1.72 -0.18 0 -0.18 0" divisor="1" bias="0" preserveAlpha="true"/></filter></svg><div class="page" id="page"><div class="loading" id="loading">Loading GRIPORA…</div><img id="reference" alt="GRIPORA homepage" style="display:none"><a class="hot" href="index.html" aria-label="Home" style="left:41.5%;top:.8%;width:7%;height:2.7%"></a><a class="hot" href="#products" aria-label="Products" style="left:48.5%;top:.8%;width:11%;height:2.7%"></a><a class="hot" href="#about" aria-label="About Us" style="left:61%;top:.8%;width:10%;height:2.7%"></a><a class="hot" href="#contact" aria-label="Contact Us" style="left:72.5%;top:.8%;width:10.5%;height:2.7%"></a><a class="hot" href="#products" aria-label="Explore Collection" style="left:5%;top:27.2%;width:19.5%;height:3%"></a><a class="hot" href="cycling-demo.html" aria-label="Cycling Gloves" style="left:2.5%;top:42.7%;width:30%;height:24%"></a><span id="products" class="anchor" style="top:37%;left:0"></span><span id="about" class="anchor" style="top:0;left:0"></span><span id="contact" class="anchor" style="top:95%;left:0"></span></div><script>(async()=>{try{const paths=Array.from({length:8},(_,i)=>`assets/home-ref-${String(i+1).padStart(2,'0')}.txt`);const parts=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()})));const img=document.getElementById('reference');img.src='data:image/webp;base64,'+parts.join('');img.onload=()=>{document.getElementById('loading').remove();img.style.display='block'}}catch(e){document.getElementById('loading').textContent='Unable to load page image. Please refresh.';console.error(e)}})();</script></body></html>
